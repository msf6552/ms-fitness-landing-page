<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Fitness | Precision Coaching</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', sans-serif; background-color: #050505; color: white; }

/* NAV */
nav {
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    background: #000;
}
.brand-logo {
    font-weight: 900;
    letter-spacing: 3px;
    color: #e63946;
}

/* HERO */
.hero {
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('bio-bg.jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    will-change: transform;
}
.hero h1 { font-size: 3.5rem; font-weight: 900; }
.hero p { color: #ccc; margin: 20px 0; }

.cta-btn {
    background: #e63946;
    padding: 15px 40px;
    color: white;
    text-decoration: none;
    font-weight: 700;
}

.sub-text { font-size: 0.9rem; color: #777; }

/* ABOUT */
.mission {
    padding: 100px 20px;
    max-width: 800px;
    margin: auto;
    text-align: center;
}
.mission h2 { color: #e63946; }

/* SERVICES */
.services {
    padding: 100px 20px;
    background: #000;
    text-align: center;
}
.service-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 30px;
}

.service-card {
    background: #050505;
    padding: 30px;
    border: 1px solid #1a1a1a;
    transition: all 0.4s ease;
    will-change: transform, opacity;
}
.service-card:hover {
    border-color: #e63946;
    transform: translateY(-10px) scale(1.02);
}

/* ANIMATIONS */
.step, .reveal {
    opacity: 0;
    transform: translateY(60px) scale(0.95);
    transition: all 0.8s ease;
    will-change: transform, opacity;
}
.active {
    opacity: 1 !important;
    transform: translateY(0) scale(1) !important;
}

/* PROGRESS BAR */
#progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 0px;
    background: #e63946;
    width: 0%;
    z-index: 999;
}
</style>
</head>

<body>

<nav>
    <div class="brand-logo">MS FITNESS</div>
</nav>

<section class="hero">
    <div>
        <h1>EVOLVE <span style="color:#e63946;">STRONGER</span></h1>
        <p>Built for individuals who are serious about changing their physique.</p>
        <a href="#how-it-works" class="cta-btn">THE MS METHODOLOGY</a>
        <p class="sub-text">Limited spots available.</p>
    </div>
</section>

<section class="mission">
    <h2>About Me</h2>
    <p>I’m <strong>Maninder Singh Sandhu</strong>...</p>
</section>

<section class="services">
    <h2>WHAT’S MORE</h2>

    <div class="service-grid">
        <div class="service-card reveal">Mindset Coaching</div>
        <div class="service-card reveal">Fat Loss</div>
        <div class="service-card reveal">Plateau Break</div>
    </div>
</section>

<div id="progress-bar"></div>

<script>
const steps = document.querySelectorAll('.step');
const reveals = document.querySelectorAll('.reveal');
const hero = document.querySelector('.hero');
const progressBar = document.getElementById('progress-bar');

let ticking = false;

/* 🔥 MAIN OPTIMIZED LOOP */
function updateUI() {
    const windowHeight = window.innerHeight;
    const scrollTop = window.scrollY;

    /* Reveal animations (NO RESET = smooth) */
    steps.forEach(el => {
        if (el.getBoundingClientRect().top < windowHeight - 100) {
            el.classList.add('active');
        }
    });

    reveals.forEach(el => {
        if (el.getBoundingClientRect().top < windowHeight - 100) {
            el.classList.add('active');
        }
    });

    /* Progress bar */
    if(scrollTop > 10) progressBar.style.height = "4px";
    const docHeight = document.body.scrollHeight - window.innerHeight;
    progressBar.style.width = (scrollTop / docHeight) * 100 + "%";

    /* Smooth parallax (GPU) */
    hero.style.transform = `translateY(${scrollTop * 0.3}px)`;

    ticking = false;
}

/* 🔥 SCROLL OPTIMIZER */
window.addEventListener('scroll', () => {
    if (!ticking) {
        window.requestAnimationFrame(updateUI);
        ticking = true;
    }
});
</script>

</body>
</html>
